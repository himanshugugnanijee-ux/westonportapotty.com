name: Daily SEO Blog

on:
  schedule:
    # 13:00 UTC is 9:00 AM during Eastern Daylight Time.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate article and update indexes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python3 scripts/generate_daily_blog.py

      - name: Commit daily article
        run: |
          git config user.name "westonportapotty.com blog bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml scripts/generate_daily_blog.py
          git diff --cached --quiet || git commit -m "Publish daily Weston portable toilet blog"
          git push origin main

      - name: Trigger Vercel deployment
        run: echo "Committed to main; Vercel will deploy from the repository's normal production integration."
      
